    function App() {
      const [unlocked,setUnlocked]=useState(false);
      return unlocked?<TrackerApp/>:<PasswordGate onUnlock={()=>setUnlocked(true)}/>;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
